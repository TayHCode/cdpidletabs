[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cdpidletabs"
version = "0.1.0"
description = "Report or close unchanged Chrome page targets through CDP"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.scripts]
cdpidletabs = "close_idle_tabs:main"

[tool.setuptools]
py-modules = ["close_idle_tabs"]
